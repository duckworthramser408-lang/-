name: Build storybook APK 0.6.9

on:
  push:
    branches: [codex/storybook-apk-0.6.9]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storybook-apk-0.6.9
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source and art update
        run: python3 ci/prepare_source.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Flutter
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = 5fc346839b5d0eef006ed8404392afb4dfae428d
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
      - name: Install Android build packages
        run: |
          { yes || true; } | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Check source
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build release APK
        working-directory: app
        run: flutter build apk --release --no-pub
      - name: Verify APK and package complete source
        run: python3 ci/verify_apk.py
      - name: Retain verified build output
        uses: actions/upload-artifact@v4
        with:
          name: catch-bugs-0.6.9
          path: |
            release/catch-bugs-0.6.9.apk
            release/catch-bugs-0.6.9-source.zip
            release/APK-validation.json
            release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.6.9 --draft --target "$GITHUB_SHA" --title "捉虫子 0.6.9 · 绘本美术版" --notes-file release/release-notes.md release/catch-bugs-0.6.9.apk release/catch-bugs-0.6.9-source.zip release/APK-validation.json release/SHA256SUMS.txt
          gh release edit v0.6.9 --draft=false
